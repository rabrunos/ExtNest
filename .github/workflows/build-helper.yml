name: Build ExtNest Helper

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r native-host/requirements-build.txt

      - name: Build native host
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/helper | Out-Null
          pyinstaller --noconfirm --clean --onefile --name ExtNestHost --distpath build/helper --workpath build/pyinstaller --specpath build/pyinstaller native-host/extnest_host.py
          Copy-Item native-host/oauth-clients.json build/helper/oauth-clients.json

      - name: Write OAuth private config
        shell: pwsh
        env:
          EXTNEST_GITHUB_CLIENT_SECRET: ${{ secrets.EXTNEST_GITHUB_CLIENT_SECRET }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:EXTNEST_GITHUB_CLIENT_SECRET)) {
            throw "Repository secret EXTNEST_GITHUB_CLIENT_SECRET is not configured."
          }
          $payload = @{
            github = @{
              client_secret = $env:EXTNEST_GITHUB_CLIENT_SECRET
            }
          } | ConvertTo-Json -Depth 4
          [System.IO.File]::WriteAllText("build/helper/oauth-private.json", $payload, [System.Text.UTF8Encoding]::new($false))

      - name: Bundle portable Git
        shell: pwsh
        run: |
          $git = (Get-Command git.exe).Source
          $gitRoot = Split-Path -Parent (Split-Path -Parent $git)
          Copy-Item $gitRoot build/helper/git -Recurse

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer/ExtNestHelper.iss

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExtNestHelperSetup
          path: dist/ExtNestHelperSetup.exe

      - name: Publish GitHub Release asset
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title $tag --generate-notes
          }
          gh release upload $tag dist/ExtNestHelperSetup.exe --clobber
