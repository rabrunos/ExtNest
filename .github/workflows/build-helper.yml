name: Build ExtNest Helper

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r native-host/requirements-build.txt

      - name: Build native host
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/helper | Out-Null
          pyinstaller --noconfirm --clean --onefile --name ExtNestHost --distpath build/helper --workpath build/pyinstaller --specpath build/pyinstaller native-host/extnest_host.py
          Copy-Item native-host/oauth-clients.json build/helper/oauth-clients.json

      - name: Write packaged configuration
        shell: pwsh
        env:
          EXTNEST_GITHUB_CLIENT_SECRET: ${{ secrets.EXTNEST_GITHUB_CLIENT_SECRET }}
          EXTNEST_EDGE_STORE_ID: ${{ vars.EXTNEST_EDGE_STORE_ID }}
          EXTNEST_CHROME_STORE_ID: ${{ vars.EXTNEST_CHROME_STORE_ID }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:EXTNEST_GITHUB_CLIENT_SECRET)) {
            throw "Repository secret EXTNEST_GITHUB_CLIENT_SECRET is not configured."
          }

          $private = @{
            github = @{
              client_secret = $env:EXTNEST_GITHUB_CLIENT_SECRET
            }
          } | ConvertTo-Json -Depth 4

          [System.IO.File]::WriteAllText(
            "build/helper/oauth-private.json",
            $private,
            [System.Text.UTF8Encoding]::new($false)
          )

          $origins = @(
            "chrome-extension://econfanmnmmcggpgdflcipmdlmkcbiag/"
          )

          if (-not [string]::IsNullOrWhiteSpace($env:EXTNEST_EDGE_STORE_ID)) {
            $origins += "chrome-extension://$($env:EXTNEST_EDGE_STORE_ID)/"
          }

          if (-not [string]::IsNullOrWhiteSpace($env:EXTNEST_CHROME_STORE_ID)) {
            $origins += "chrome-extension://$($env:EXTNEST_CHROME_STORE_ID)/"
          }

          $nativeManifest = @{
            name = "com.extnest.host"
            description = "ExtNest Native Messaging Host"
            path = "__EXTNEST_HOST_PATH__"
            type = "stdio"
            allowed_origins = $origins
          } | ConvertTo-Json -Compress -Depth 5

          [System.IO.File]::WriteAllText(
            "build/helper/com.extnest.host.template.json",
            $nativeManifest,
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer/ExtNestHelper.iss

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExtNestHelperSetup
          path: dist/ExtNestHelperSetup.exe

      - name: Publish GitHub Release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $manifest = Get-Content extension/manifest.json -Raw | ConvertFrom-Json
          $tag = "v$($manifest.version)"

          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target "${{ github.sha }}" --title $tag --generate-notes
          }

          gh release upload $tag dist/ExtNestHelperSetup.exe --clobber
